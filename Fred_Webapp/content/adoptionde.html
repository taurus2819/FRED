<script type="text/javascript" src="/online/scripts/ajax.js"></script>
<script type="text/javascript" src="scripts/locate.js"></script>
<script type="text/javascript" src="scripts/fade.js"></script>
{@startDETable}
<table border="0" style="border: none; width: 550px; text-align: left" width="550" cellspacing="0" cellpadding="2">
<tr><td colspan="4" class="deHeading">Adoption details</td></tr><tr><td style="text-align: left"><tr>
<td colspan="2" width="250" class="heading">Adoption Date</td>
<td width="330"><input type="text" name="AdoDate" value="{@AdoDate}">&nbsp;&nbsp;&nbsp;<a href="javascript:var x = document.getElementById('AdoDateCal').onfollow()"><img id="AdoDateCal" border="0" src="images/calendar.gif"></a></td>
</tr>
<tr>
<td colspan="2" width="250" class="heading">Adoptors</td>
<td width="270"><textarea name="Adoptor" cols="40" rows="2">{@Adoptor}</textarea></td>
<td width="30"><a href="#" onClick="newWin=open('data_entry_supp.jsp?Type=Adoptor', 'Supp', 'width=800,height=400');return false;" title="Build..."><img src="images/build.gif" width="20" height="20" border="0" /></a></td>
</tr>
<tr>
<td class="heading" colspan="2">Stage Limits<br />
<span class="smalltext">Enter oldest age first. For uncertain limits enter a ? at end of stage name</span></td>
<td>
<input type="text" id="StageStageStart" name="StageStageStart2" size="20" value="{@StageStageStart}" />&nbsp;to&nbsp;
<input type="text" id="StageStageStop" name="StageStageStop2" size="20" value="{@StageStageStop}" />

<script><!--
new ContextHint(
	document.getElementById("StageStageStart"),
	function generateURL(start) {
		return "ajaxSupport.xml?action=List&type=Age&start=" + start + "&q=" + Math.random();
	},
	null,
	true
);

new ContextHint(
	document.getElementById("StageStageStop"),
	function generateURL(start) {
		return "ajaxSupport.xml?action=List&type=Age&start=" + start + "&q=" + Math.random();
	},
	null,
	true
);
//--></script>
</td>
</tr>
<tr>
<td class="heading" colspan="2">Comments</td>
<td><textarea name="Comm" cols="40" rows="3">{@Comm}</textarea></td>
</tr>
</table>
{@endDETable}
