{@startDETable}
<table border="0" style="border: none; width: 550px; text-align: left" width="550" cellspacing='0' cellpadding='2'>
<tr><td colspan="3" class="deHeading">Drillhole information</td></tr><tr><td style="text-align: left">
<tr>
<td colspan="2" width="250" class="heading">Operating Company</td>
<td><input type="text" name="Person" value="{@Person}" size="40"></td>
</tr>
<tr>
<td width="150" class="heading">Drilling Dates</td>
<td width="100" class="smallheading">Spud Date</td>
<td width="300"><input type="text" name="StartDate" id="StartDate" value="{@StartDate}">&nbsp;&nbsp;&nbsp;<a href="javascript:var x = document.getElementById('StartDateCal').onfollow()"><img id="StartDateCal" border="0" src="images/calendar.gif"></a></td>
</tr>
<tr>
<td class="heading"></td>
<td class="smallheading">Completion Date</td>
<td><input type="text" name="FinishDate" id="FinishDate" value="{@FinishDate}">&nbsp;&nbsp;&nbsp;<a href="javascript:var x = document.getElementById('FinishDateCal').onfollow()"><img id="FinishDateCal" border="0" src="images/calendar.gif"></a></td>
</tr>
<tr>
<td class="heading">License Area</td><td></td>
<td><input type="text" name="LicArea" value="{@LicArea}" size="40"></td>
</tr>
<tr>
<td class="heading">Datum Elevation</td>
<td></td>
<td><select name="DatumType">
<option value="-">-- Choose --</option>
<option value="RT"{@@isRT: selected@}>RT</option>
<option value="KB"{@@isKB: selected@}>KB</option>
<option value="Seafloor"{@@isSeafloor: selected@}>Seafloor</option>
</select>&nbsp;&nbsp;<input type="text" name="DatumEl" value="{@datumElevation}" size="10">&nbsp;asl</td>
</tr>
<tr>
<td class="heading">Drillhole Depths</td>
<td class="smallheading">Kick-off</td>
<td class="smallheading"><input type="text" name="StartDepth" value="{@startDepth}"></td>
</tr>
<tr>
<td class="heading"></td>
<td class="smallheading">Termination (TD)</td>
<td class="smallheading"><input type="text" name="FinishDepth" value="{@finishDepth}"></td>
</tr>
<tr>
<td class="heading">Depth Unit</td>
<td><td></td><input type="radio" name="DepthUnit" value="m" {@depthm}/>Metres&nbsp;&nbsp;<input type="radio" name="DepthUnit" value="ft" {@depthft}/>Feet</td>
</tr>
</table>
{@endDETable}
