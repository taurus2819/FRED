{@startDETable}
<table border="0" style="border: none; width: 550px; text-align: left" width="550" cellspacing='0' cellpadding='2'>
<tr><td colspan="4" class="deHeading">Section information</td></tr><tr><td style="text-align: left">
<tr>
<td colspan="2" class='heading' width="250">Section Collector</td>
<td width="270"><input type='text' name='Person' value="{@Person}" size='40'></td>
<td width="30"></td>
</tr>
<tr>
<td width="150" class='heading'>Sampling Dates</td>
<td width="100" class='smallheading'>Start Date</td>
<td><input type='text' name='StartDate' id="StartDate" value="{@StartDate}"></td>
<td></td>
</tr>
<tr>
<td class='heading'></td>
<td class='smallheading'>Completion Date</td>
<td><input type='text' name='FinishDate' id='FinishDate' value="{@FinishDate}"></td>
<td></td>
</tr>
<tr>
<td class='heading'>Datum Elevation</td>
<td></td>
<td class='smallheading'><select name='DatumType'>
<option value='-'>-- Choose --</option>
<option value='Top'{@@isTop: selected@}>Top</option>
<option value='Bottom'{@@isBottom: selected@}>Bottom</option>
</select>&nbsp;&nbsp;<input type='text' name='DatumEl' value="{@datumElevation}" size='10'>&nbsp;m&nbsp;asl</td>
</tr>
<tr>
<td class='heading'>Section Heights</td>
<td class='smallheading'>Top Horizon</td>
<td class='smallheading'><input type='text' name='StartDepth' value="{@startDepth}">&nbsp;m</td>
</tr>
<tr>
<td class='heading'></td>
<td class='smallheading'>Base Horizon</td>
<td class='smallheading'><input type='text' name='FinishDepth' value="{@finishDepth}">&nbsp;m</td>
</tr>
</table>
{@endDETable}
